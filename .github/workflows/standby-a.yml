# Short public knock every 5 minutes, and a spare starter for the long shift.
# No secrets.
name: standby-a

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Knock the site
        run: |
          set -u
          BASE="https://warera-bot-y8ia.onrender.com"
          curl -sS -o /dev/null -w "home:%{http_code}\n" --retry 4 --retry-all-errors --retry-delay 8 --max-time 90 "$BASE/" || true
          ok=0
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/wake.txt -w "%{http_code}" --max-time 90 "$BASE/api/cron/production?wake=1" || echo "000")
            echo "try $i wake:$code"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 12
          done
          echo "response:"
          head -c 200 /tmp/wake.txt 2>/dev/null || true
          echo
          test "$ok" = "1"
      - name: Make sure the long shift is running
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh run list --workflow shift.yml --status in_progress --limit 5 --json databaseId --jq 'length')
          echo "shifts running: $count"
          if [ "$count" = "0" ]; then
            gh workflow run shift.yml --ref main --repo ${{ github.repository }} || true
          fi
