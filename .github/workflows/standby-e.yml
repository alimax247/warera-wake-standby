# Backup public knock, separate repository. No secrets.
# GitHub's own timer did not fire on the free plan, so this job also arms the next
# knock itself after four minutes. Several of these run side by side.
name: standby-e

on:
  schedule:
    - cron: "4-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Knock the site and wake the clock
        run: |
          set -u
          BASE="https://warera-bot-y8ia.onrender.com"
          curl -sS -o /dev/null -w "home:%{http_code}\n" --retry 4 --retry-all-errors --retry-delay 8 --max-time 90 "$BASE/" || true
          ok=0
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/wake.txt -w "%{http_code}" --max-time 90 "$BASE/api/cron/production?wake=1" || echo "000")
            echo "try $i wake:$code"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 12
          done
          echo "response:"
          head -c 300 /tmp/wake.txt 2>/dev/null || true
          echo
          test "$ok" = "1"
      - name: Arm the next knock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 240
          gh workflow run standby-e.yml --ref main --repo ${{ github.repository }}
